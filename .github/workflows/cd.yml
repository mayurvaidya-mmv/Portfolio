name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Portfolio to Amazon S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore"

      - name: Deploy S3 Content to AWS Amplify
        run: |
          aws amplify start-deployment \
            --app-id d2xwzznmx5uwd4 \
            --branch-name staging \
            --source-url s3://${{ secrets.S3_BUCKET }} \
            --source-url-type BUCKET_PREFIX

      - name: Deployment Completed
        run: echo "Portfolio Successfully Deployed to S3 and Amplify"